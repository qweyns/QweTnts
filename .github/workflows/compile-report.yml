name: Compile report (temp)

# Временный воркфлоу: печатает ошибки компилятора в аннотации проверки,
# чтобы их можно было прочитать через API (логи Actions недоступны).
on:
  push:
    branches: [ arena/** ]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Checkout QweProtectionStones
        uses: actions/checkout@v4
        with:
          repository: qweyns/QweProtectionStones
          ref: main
          path: QweProtectionStones

      - name: Install QweProtectionStones to local repo
        working-directory: QweProtectionStones
        run: mvn -B install -DskipTests

      - name: Compile QweTnts (report)
        continue-on-error: true
        run: mvn -B clean package 2>&1 | tee build.log

      - name: Annotate compiler errors
        run: |
          awk '/^\[ERROR\]/{c=5} c&&c--' build.log | head -200 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "--- итог ---"
          grep -cE "^\[ERROR\]" build.log || true
