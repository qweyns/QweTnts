name: Compile report (temp)

# Временный воркфлоу: печатает полный вывод компилятора и выкладывает его
# артефактом. Нужен, чтобы видеть текст ошибок без доступа к логам Actions.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Checkout QweProtectionStones
        uses: actions/checkout@v4
        with:
          repository: qweyns/QweProtectionStones
          ref: main
          path: QweProtectionStones

      - name: Install QweProtectionStones to local repo
        working-directory: QweProtectionStones
        run: mvn -B install -DskipTests

      - name: Compile QweTnts (report)
        id: compile
        continue-on-error: true
        run: mvn -B clean test-compile -DskipTests 2>&1 | tee build.log

      - name: Summary
        run: |
          echo "### Ошибки компиляции" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "ERROR|error:|warning:" build.log | head -120 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
