# ============================================================
#   QweTnts — кастомные динамиты поверх QweProtectStones
# ============================================================
#  • параметры каждого динамита — отдельным файлом в dynamites/
#  • все сообщения игрокам — в lang/ru_RU.yml, lang/en_US.yml
#    (MiniMessage + %плейсхолдеры%, как в QweProtectStones)
#  • после правок: /qtnt reload
# ============================================================

settings:
  # Язык сообщений: ru_RU, en_US (файлы лежат в папке lang/).
  language: "ru_RU"

  # --- Динамиты ---------------------------------------------------------
  dynamites:
    # ГЛАВНЫЙ ПЕРЕКЛЮЧАТЕЛЬ ПОДЖОГА.
    #   false  — динамит НЕ загорается сам: игрок ставит его блоком (как
    #            обычный TNT) и поджигает отдельно — огнивом, огненным
    #            зарядом, огнём, лавой или другим взрывом. Механика HolyWorld.
    #   true   — старое поведение: клик предметом — и заряд сразу горит.
    # Значение можно переопределить для конкретного динамита ключом
    # `auto-ignite` в его файле в dynamites/ (приоритет у файла динамита).
    auto-ignite: false

    # Снимать ли предмет из руки при установке/поджоге. В креативе не снимается.
    consume-on-use: true
    # Разрешить поджигать установленный динамит ударом (левый клик).
    punch-ignites: false
    # Радиус цепной детонации: взрыв поджигает установленные динамиты
    # в этом радиусе (в блоках). 0 — выключить.
    chain-radius: 4
    # Задержка перед цепным поджогом в тиках (20 тиков = 1 сек).
    chain-delay-ticks: 2

  # --- Анти-лаг ---------------------------------------------------------
  anti-lag:
    # Сколько горящих зарядов одновременно может держать один игрок (0 = без лимита).
    max-primed-per-player: 32
    # Сколько горящих зарядов одновременно в одном чанке (0 = без лимита).
    max-primed-per-chunk: 64
    # Кулдаун между установкой/поджогом динамита на игрока (мс).
    # При выключенном auto-ignite этот кулдаун НЕ мешает уже установленный
    # заряд поджечь сразу.
    activation-cooldown-millis: 250
    # Кулдаун на повтор служебных сообщений игроку (мс) — анти-спам в чат.
    message-cooldown-millis: 1000
    # Порог мощности: выше него в лог пишется предупреждение (возможны лаги).
    large-explosion-threshold-power: 16
    # Максимальный радиус досмотра прочных блоков (обсидиан и т.п.) вокруг
    # эпицентра. Ограничивает нагрузку при большом power.
    max-break-scan-radius: 8

  # --- Рейд-блоки (анти-феникс) ----------------------------------------
  raid-blocks:
    # Как часто вычищать истёкшие метки (тики).
    cleanup-interval-ticks: 600
    # Как часто сбрасывать raid-blocks.yml на диск (тики).
    autosave-interval-ticks: 2400

  # --- Установленные (не подожжённые) динамиты --------------------------
  placed-dynamites:
    # Как часто сбрасывать placed.yml на диск (тики).
    autosave-interval-ticks: 2400
    # Как часто вычищать записи, под которыми блока TNT уже нет (тики).
    cleanup-interval-ticks: 1200

  # --- Миры и зоны ------------------------------------------------------
  worlds:
    # BLOCKED — разрешены все миры, кроме blocked-worlds
    # ALLOWED — разрешены только миры из allowed-worlds
    mode: BLOCKED
    allowed-worlds: []
    blocked-worlds: []
    # Запрет радиуса вокруг спавна обычного мира (блоков, 0 = выключено).
    spawn-radius: 0

  # --- Алерты -----------------------------------------------------------
  alerts:
    # Как часто можно слать повторный алерт владельцу привата (мс).
    attack-alert-cooldown-millis: 30000

  # --- Анонимная статистика bStats (https://bstats.org) -----------------
  bstats-enabled: true
