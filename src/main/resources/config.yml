# ============================================================
#   QweTnts — кастомные динамиты поверх QweProtectStones
# ============================================================
#  • параметры каждого динамита — отдельным файлом в dynamites/
#  • тротиловая пушка — отдельным файлом cannon.yml в корне плагина
#  • все сообщения игрокам — в lang/ru_RU.yml, lang/en_US.yml
#    (MiniMessage + %плейсхолдеры%, как в QweProtectStones)
#  • после правок: /qtnt reload
# ============================================================

settings:
  # Язык сообщений: ru_RU, en_US (файлы лежат в папке lang/).
  language: "ru_RU"

  # --- Динамиты ---------------------------------------------------------
  dynamites:
    # ГЛАВНЫЙ ПЕРЕКЛЮЧАТЕЛЬ ПОДЖОГА.
    #   false  — динамит НЕ загорается сам: игрок ставит его блоком (как
    #            обычный TNT) и поджигает отдельно — огнивом, огненным
    #            зарядом, огнём, лавой или другим взрывом. Механика HolyWorld.
    #   true   — старое поведение: клик предметом — и заряд сразу горит.
    # Значение можно переопределить для конкретного динамита ключом
    # `auto-ignite` в его файле в dynamites/ (приоритет у файла динамита).
    auto-ignite: false

    # Снимать ли предмет из руки при установке/поджоге. В креативе не снимается.
    consume-on-use: true
    # Разрешить поджигать установленный динамит ударом (левый клик).
    punch-ignites: false
    # Радиус цепной детонации: взрыв поджигает установленные динамиты
    # в этом радиусе (в блоках). 0 — выключить.
    chain-radius: 4
    # Задержка перед цепным поджогом в тиках (20 тиков = 1 сек).
    chain-delay-ticks: 2
    # Радиус поиска горящего динамита, чтобы срезать урон от его взрыва
    # (настройки cut-entity / cut-player в файлах dynamites/). Чем больше
    # радиус, тем точнее находится источник — и тем дороже перебор сущностей
    # на каждое событие урона. Блоки, 1..16.
    damage-source-radius-blocks: 6

  # --- Анти-лаг ---------------------------------------------------------
  anti-lag:
    # Сколько горящих зарядов одновременно может держать один игрок (0 = без лимита).
    max-primed-per-player: 32
    # Сколько горящих зарядов одновременно в одном чанке (0 = без лимита).
    max-primed-per-chunk: 64
    # Кулдаун между установкой/поджогом динамита на игрока (мс).
    # При выключенном auto-ignite этот кулдаун НЕ мешает уже установленный
    # заряд поджечь сразу.
    activation-cooldown-millis: 250
    # Кулдаун на повтор служебных сообщений игроку (мс) — анти-спам в чат.
    message-cooldown-millis: 1000
    # Порог мощности: выше него в лог пишется предупреждение (возможны лаги).
    large-explosion-threshold-power: 16
    # Максимальный радиус досмотра прочных блоков (обсидиан и т.п.) вокруг
    # эпицентра. Ограничивает нагрузку при большом power.
    max-break-scan-radius: 8
    # ПОРЦИОННАЯ ОБРАБОТКА крупных взрывов: сколько блоков за один тик
    # максимум меняет плагин. Остальное доделывается в следующих тиках.
    large-explosion-blocks-per-tick: 512
    # Через сколько тиков брать следующую порцию (1 = каждый тик).
    large-explosion-tick-period: 1
    # Предел числа отложенных действий за один взрыв: трансформации,
    # тихие удаления, выбитые спавнеры и метки рейд-блоков. `max-blocks`
    # считает только блоки из списка vanilla, а метки и трансформации
    # досмотр прочных блоков добавляет сверх него — здесь предел общий.
    # 0 = без предела.
    max-pending-per-explosion: 4096

  # --- Рейд-блоки (анти-феникс) ----------------------------------------
  raid-blocks:
    # Как часто вычищать истёкшие метки (тики).
    cleanup-interval-ticks: 600
    # Как часто сбрасывать raid-blocks.yml на диск (тики).
    autosave-interval-ticks: 2400

  # --- Временные блоки (лёд после взрыва и т.п.) ------------------------
  temporary-blocks:
    # Как часто проверять, не истёк ли срок у временных блоков (тики).
    cleanup-interval-ticks: 100
    # Как часто сбрасывать temporary-blocks.yml на диск (тики).
    autosave-interval-ticks: 1200

  # --- Установленные (не подожжённые) динамиты --------------------------
  placed-dynamites:
    # Как часто сбрасывать placed.yml на диск (тики).
    autosave-interval-ticks: 2400
    # Как часто вычищать записи, под которыми блока TNT уже нет (тики).
    cleanup-interval-ticks: 1200

  # --- Миры и зоны ------------------------------------------------------
  worlds:
    # BLOCKED — разрешены все миры, кроме blocked-worlds
    # ALLOWED — разрешены только миры из allowed-worlds
    mode: BLOCKED
    allowed-worlds: []
    blocked-worlds: []
    # Запрет радиуса вокруг спавна обычного мира (блоков, 0 = выключено).
    spawn-radius: 0

  # --- Алерты -----------------------------------------------------------
  alerts:
    # Как часто можно слать повторный алерт владельцу привата (мс).
    attack-alert-cooldown-millis: 30000

    # Discord-вебхук (Фаза 2): короткие сообщения о важных событиях рейда.
    # Отправка асинхронная, ошибки сети — максимум запись в лог.
    discord:
      enabled: false
      # Ссылка вида https://discord.com/api/webhooks/... ; только https.
      webhook-url: ""
      username: "QweTnts"
      avatar-url: ""
      # ID роли, которую нужно упомянуть (пусто — без упоминания).
      mention-role-id: ""
      timeout-millis: 5000
      events:
        - REGION_DESTROYED

  # --- Анонимная статистика bStats (https://bstats.org) -----------------
  bstats-enabled: true

# --- Голограмма над горящим зарядом ------------------------------------
# Показывает, сколько секунд осталось до взрыва. Работает и на снаряде
# пушки: табличка едет вместе с зарядом.
#
# Провайдер (provider):
#   AUTO   — FancyHolograms, иначе DecentHolograms, иначе встроенный
#   FANCY  — только FancyHolograms (нет плагина — встроенный)
#   DECENT — только DecentHolograms (нет плагина — встроенный)
#   NATIVE — всегда встроенный (TextDisplay)
# На Folia мосты не работают, поэтому там всегда встроенный.
holograms:
  enabled: true
  provider: AUTO

  # Сколько голограмм одновременно. Защита от лаг-машины: зажгли сотню
  # зарядов — сотню табличек не рисуем. 0 = без предела.
  max-active: 48

  # Ехать за зарядом. Выключить — табличка останется там, где зажгли.
  follow-projectile: true

  # Как часто обновлять отсчёт (тики). Это же частота смены цифр:
  # 5 тиков = 4 раза в секунду.
  update-interval-ticks: 5

  # Строки. Пустые — голограммы не будет.
  # Подстановки: %seconds% — секунд до взрыва, %ticks% — тиков,
  #              %name% — название динамита, %player% — кто поджёг.
  lines:
    - "<#FDE68A>⚡ <#F2EFFA>%seconds% с"
    - "<#A79FC0>%name%"

  # --- Оформление (как в QweProtectStones) ------------------------------
  settings:
    # Высота над зарядом (блоков).
    offset: 1.1
    # С какого расстояния видно (блоков).
    display-range: 24
    # Видно сквозь стены.
    see-through: false
    # Тень текста.
    shadow: true
    # Масштаб (1.0 — обычный).
    scale: 1.0
    # Поворот к игроку: CENTER, VERTICAL, HORIZONTAL, FIXED.
    billboard: CENTER
    # Выравнивание текста: LEFT, CENTER, RIGHT.
    text-alignment: CENTER
    # Фон плашки: #AARRGGBB (например #40000000 — полупрозрачный чёрный).
    # Пусто — без фона.
    background: ""
    # Право на просмотр (только DecentHolograms и FancyHolograms;
    # встроенный провайдер покажет всем и один раз запишет об этом в лог).
    permission: ""
