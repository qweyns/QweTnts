# ============================================================
#   Бункер замка — стена, которую пробивают из Тнт-пушки
# ============================================================
#  Механика HolyWorld (вики -> Ивенты -> Замок):
#    • в лабиринтах под замком есть комната; в ней большая стена
#      и раздатчик напротив;
#    • игроки заряжают раздатчик динамитом, он стреляет в стену;
#    • у каждого динамита свой шанс сломать стену;
#    • стена деградирует: древние обломки -> плачущий обсидиан ->
#      обсидиан -> дыра. За пробитой стеной — награда.
#
#  Отличия от HolyWorld (так решила администрация):
#    • считаются ТОЛЬКО выстрелы из Тнт-пушки. Подойти к стене
#      с C4 в руках и подорвать её «в упор» нельзя: блоки стены
#      вычищаются из любых списков разрушения;
#    • награду за пробитую стену выдаёт НЕ аддон: он выполняет команду
#      от имени консоли, а шалкер с добычей ставит другой плагин;
#    • восстановление стены — и по таймеру, и вручную командой
#      /qtnt bunker reset.
#
#  Как настроить:
#    1. enabled: true и укажите мир (world).
#    2. Задайте угол стены: wall.from и wall.to — любые два
#      противоположных угла прямоугольника, [x, y, z].
#    3. /qtnt bunker — проверить, что плагин увидел стену.
#    4. /qtnt bunker stage 0 — вернуть стену в исходную стадию.
#
#  Файл лежит здесь, а не в dynamites/, потому что бункер — не
#  динамит, а отдельная механика, и он один на весь сервер.
# ============================================================

enabled: false

# Мир, в котором стоит замок. Пусто — бункер не загрузится.
world: "world"

# --- Стена --------------------------------------------------
wall:
  # Два противоположных угла прямоугольника: x, y, z через запятую.
  # Порядок не важен — плагин сам разберёт, где минимум, а где максимум.
  # Можно и списком (по строке на число) — как кому удобнее.
  from: -8, 40, -8
  to: 8, 55, 8

  # Стадии стены, от самой прочной к самой слабой.
  # ПОСЛЕДНЯЯ СТАДИЯ ВСЕГДА AIR — то есть дыра. Если последней
  # стоит не AIR, плагин добавит AIR сам.
  #
  # Классика HolyWorld: древние обломки -> плачущий обсидиан ->
  # обсидиан -> дыра. Хотите меньше стадий — уберите лишнее;
  # минимально нужно две (материал + AIR).
  stages:
    - ANCIENT_DEBRIS      # первая ступень — самая прочная
    - CRYING_OBSIDIAN     # вторая
    - OBSIDIAN            # третья
    - AIR                 # четвёртая — дыра, то есть стена пробита

  # На сколько блоков вокруг стены считать взрыв «попал в стену».
  # Запас нужен потому, что эпицентр — это точка взрыва снаряда,
  # а снаряд обычно не долетает до самой кладки.
  hit-margin: 3

  # true — блоки стены вычищаются из списков разрушения: стену
  # нельзя подорвать ничем, кроме шанса от выстрела пушки.
  # false — защита снята; тогда стену можно ломать и обычными
  # динамитами (но шанс от пушки всё равно работает).
  protect: true

# --- Шанс пробить стену -------------------------------------
chances:
  # Шанс в ПРОЦЕНТАХ за один выстрел из пушки. Дробные значения
  # работают: 0.4 — это ровно 0,4 %, а не ноль и не единица.
  #
  # Ключ — id динамита (поле name: в файле из dynamites/).
  # Особый ключ tnt — ванильный динамит (TNT) из пушки.
  # Если ключа нет, берётся default.
  #
  # Значения HolyWorld Lite:
  #   обычный динамит   0.4 %
  #   Динамит A         0.8 %
  #   Динамит B         2 %
  #   C4                5 %
  #   Разрывная волна   12.5 %
  #   Б2, Стиллер,
  #   Н. Стиллер,
  #   Ледяная волна     0.4 %
  default: 0.4
  dynamite_a: 0.8
  dynamite_b: 2.0
  dynamite_b2: 0.4
  c4: 5.0
  shockwave: 12.5
  stiller: 0.4
  reliable_stiller: 0.4
  ice_wave: 0.4
  tnt: 0.4

# --- Темп стрельбы ------------------------------------------
# Минимальная пауза между засчитанными выстрелами, мс.
# Зачем: залп из десяти пушек — это десять взрывов за тик, и без
# паузы шанс покрутился бы десять раз подряд. 500 мс — примерно
# один засчитанный выстрел в полсекунды на весь бункер.
# 0 — без паузы (каждый взрыв = ролл).
cooldown-millis: 500

# --- Восстановление стены -----------------------------------
respawn:
  # true — после пробития стена сама вернётся через interval-minutes.
  enabled: true

  # Через сколько минут возвращать стену.
  interval-minutes: 60

  # true — при восстановлении стадия случайная (как на HolyWorld,
  # где при появлении ивента стена бывает слабой, средней или
  # прочной). false — всегда самая прочная, стадия 0.
  random-stage: true

# --- Награда за пробитую стену ------------------------------
#  Аддон ничего не спавнит сам: выполняет команды от имени консоли,
#  а шалкер с добычей ставит тот плагин, который на сервере отвечает
#  за ивенты. Так награда остаётся в ваших руках и не зависит от
#  чужого формата.
#
#  Подстановки:
#    %player% — игрок, чей выстрел пробил стену (или «—», если выстрел
#               был не от игрока: например, от редстоун-автомата);
#    %world%, %x%, %y%, %z% — центр стены (куда ставить шалкер).
#
#  Пустой список — награды нет. Команды выполняются один раз: пока
#  стена пробита, повторные роллы не крутятся (см. cooldown-millis
#  и состояние breached в bunker-state.yml).
reward:
  commands: []
  #  commands:
  #    - "say Стена бункера пробита игроком %player%!"
  #    - "myevents spawn shulker %world% %x% %y% %z%"

# --- Объявления ---------------------------------------------
# true — писать в чат мира, когда стена дала трещину, пробита
# или восстановлена.
announce: true

# --- Эффекты ------------------------------------------------
# Формат тот же, что у динамитов: sound, category, volume, pitch,
# particle, particle-count, spread. Пустой блок — без эффекта.
effects:
  # Стена сняла одну стадию, но ещё стоит.
  on-degrade:
    sound: block.ancient_debris.break
    category: BLOCKS
    volume: 1.6
    pitch: 0.7
    particle: EXPLOSION
    particle-count: 8
    spread: 1.0

  # Стена пробита насквозь.
  on-breach:
    sound: entity.generic.explode
    category: BLOCKS
    volume: 2.0
    pitch: 0.6
    particle: EXPLOSION_EMITTER
    particle-count: 16
    spread: 2.0
