# ============================================================
#   Тнт-Пушка — раздатчик, запускающий динамит по редстоуну
# ============================================================
#  Механика HolyWorld (вики -> Динамит -> Тнт-Пушка):
#    • пушка — это раздатчик, стреляющий туда, куда смотрит дулом;
#    • запускает динамит со скоростью 5 блоков в секунду;
#    • запущенный динамит сохраняет все свои свойства;
#    • активируется сигналом редстоуна.
#
#  Почему файл лежит здесь, а не в dynamites/?
#  Пушка — не динамит, а отдельное устройство: она не взрывается
#  на месте, а выстреливает тем динамитом, который в неё положили.
#
#  Как пользоваться:
#    1. Поставить блоком. Дуло смотрит туда же, куда у раздатчика —
#       то есть на игрока, который его ставил.
#    2. ПКМ — открыть меню 3x3. По краям красные стеклянные панели:
#       их нельзя взять, сдвинуть или заменить. В центр — динамит.
#    3. Подать сигнал редстоуна — пушка выстрелит ОДНИМ зарядом.
#       Остаток останется лежать в пушке.
# ============================================================

enabled: true

# Право на установку, зарядку и выстрел.
permission: "qwetnts.cannon"

# --- Предмет пушки ------------------------------------------
item:
  # ВАЖНО: материал — это блок, на который рассчитана PDC-метка пушки.
  # Менять его на работающем сервере можно только в пределах семейства
  # раздатчиков (DISPENSER ↔ DROPPER): уже поставленные пушки из другого
  # материала перестанут опознаваться (меню не откроется, при поломке
  # блок упадёт без предмета).
  material: DISPENSER
  display_name: "<gradient:#FFB347:#FF6B35>Тнт-Пушка</gradient>"
  lore:
    - ""
    - "<#A79FC0> ▪ <#F2EFFA>Запускает динамит на расстояние (скорость и дальность"
    - "<#A79FC0>   <#F2EFFA>настраиваются в cannon.yml)."
    - "<#A79FC0> ▪ <#F2EFFA>Снаряд сохраняет все свойства динамита."
    - "<#A79FC0> ▪ <#F2EFFA>Ставится блоком, дуло смотрит на вас."
    - "<#A79FC0> ▪ <#F2EFFA>ПКМ — зарядить, сигнал редстоуна — выстрел."
    - ""
    - "<#A79FC0><italic>Не крафтится · премиум-магазин /shop."
  glow: true
  custom-model-data: 0
  item-model: ""
  unbreakable: false

# На HolyWorld пушку нельзя скрафтить — поэтому выключено.
# Включите craftable: true, если пушка должна крафтиться.
craftable: false
recipe:
  shape:
    - "IGI"
    - "GTG"
    - "IRI"
  ingredients:
    I: IRON_INGOT
    G: GUNPOWDER
    T: TNT
    R: REDSTONE

# --- Меню пушки ---------------------------------------------
menu:
  title: "&cТнт-Пушка"
  border-material: RED_STAINED_GLASS_PANE   # рамка вокруг центрального слота
  border-name: " "                          # имя панели; пробел — без названия

# --- Выстрел ------------------------------------------------
launch:
  speed-blocks-per-second: 5.0   # как на HolyWorld: 5 блоков в секунду
  max-range-blocks: 20           # 0 — без лимита; иначе фитиль укоротится,
                                 # и снаряд взорвётся не дальше этой дистанции
  upward: 0.0                    # вертикальная добавка: снаряд летит выше дугой
  gravity: true                  # false — летит по прямой, как ракета
  delay-ticks: 4                 # задержка от сигнала до выстрела (как у раздатчика)

# --- Чем можно заряжать -------------------------------------
ammunition:
  # BLACKLIST — можно всё, кроме списка; WHITELIST — только из списка.
  mode: BLACKLIST
  # id динамитов из папки dynamites/ + особый id tnt для ванильного TNT.
  dynamites: []
  # Примеры:
  #   mode: WHITELIST — только Динамит B и ванильный TNT:
  #     dynamites:
  #       - dynamite_b
  #       - tnt
  #   mode: BLACKLIST — всё, кроме C4:
  #     dynamites:
  #       - c4

# --- Где пушка работает -------------------------------------
# INHERIT — как в config.yml (settings.worlds).
worlds:
  mode: INHERIT
  allowed-worlds: []
  blocked-worlds: []

# --- Эффект выстрела ----------------------------------------
effects:
  on-shot:
    sound: entity.tnt.primed
    category: BLOCKS
    volume: 1.4
    pitch: 0.7
    particle: SMOKE
    particle-count: 12
    spread: 0.3
