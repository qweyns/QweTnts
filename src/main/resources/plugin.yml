name: QweTnts
version: '${project.version}'
main: ru.qweyns.qwetnts.QweTnts
api-version: '1.21'
folia-supported: true
author: qweyns
description: Кастомные динамиты поверх QweProtectStones (механика HolyWorld Lite)
depend:
  - QweProtectStones

commands:
  qwetnts:
    description: Администрирование кастомных динамитов
    usage: /<command> <reload|give|list|help>
    permission: qwetnts.admin
    aliases:
      - qtnt
      - tnts

permissions:
  qwetnts.admin:
    description: Доступ к командам /qtnt (reload, list, give)
    default: op
  qwetnts.use:
    description: Использование любых динамитов (если нет qwetnts.type.<id>)
    default: true
  qwetnts.type.<id>:
    description: >
      Использование конкретного динамита (например, qwetnts.type.c4).
      Идентификатор — поле name в файле dynamites/*.yml.
    default: op
  qwetnts.cannon:
    description: >
      Тнт-пушка: установка блока, зарядка и выстрел.
      Файл настроек — cannon.yml в корне папки плагина.
    default: true
  qwetnts.bypass.world:
    description: Игнорировать ограничения по мирам и радиусу спавна
    default: op
  qwetnts.bypass.region:
    description: Ставить динамиты в чужих приватах (не влияет на разрушение)
    default: op
  qwetnts.bypass.antilag:
    description: Игнорировать кулдаун активации и лимиты анти-лага
    default: op
  qwetnts.bypass.raidblock:
    description: Ставить обсидиан на месте рейд-блока
    default: op
