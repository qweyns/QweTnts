# ============================================================
#   Компоненты крафта QweTnts
# ============================================================
#  Компонент — это предмет-ингредиент: он сам не взрывается, но
#  нужен в продвинутых рецептах. Первый из них — Взрывчатое
#  вещество из HolyWorld Lite: 9 пороха собираются в одну
#  единицу вещества, а вещество можно разложить обратно.
#
#  Как использовать в рецепте динамита:
#
#      ingredients:
#        E:
#          component: explosive    # требуется именно наш предмет по PDC
#
#  (сокращённо: `E: component:explosive`)
# ============================================================

components:
  explosive:
    enabled: true
    display_name: "<gradient:#FDE68A:#FCA5A5>Взрывчатое вещество</gradient>"
    lore:
      - ""
      - "<#A79FC0> ▪ <#F2EFFA>Компонент для продвинутых рецептов взрывчаток."
      - "<#A79FC0> ▪ <#F2EFFA>Можно разложить обратно в 9 пороха."
      - ""
      - "<#A79FC0><italic>Крафт: 9 пороха."
    # Материал обычного пороха + PDC-метка: внешне предмет выглядит
    # как порох, но рецепты требуют именно метку, а не материал.
    material: GUNPOWDER
    glow: true
    custom-model-data: 0
    item-model: ""
    unbreakable: false

    craftable: true
    recipe:
      # 9 пороха → 1 взрывчатое вещество.
      shape:
        - "GGG"
        - "GGG"
        - "GGG"
      ingredients:
        G: GUNPOWDER

    # Обратный крафт: 1 вещество → 9 пороха (бесформенный рецепт).
    # Требуется ровно наш предмет — обычный порох не подойдёт.
    reverse:
      enabled: true
      result: GUNPOWDER
      amount: 9
