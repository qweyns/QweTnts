# Динамит A — базовый заряд: радиус урона осаде ×3, радиус ломания блоков
# больше обычного (power 6 против 4 у ванильного TNT), фитиль 5 секунд.
#
# Обсидиан НЕ берёт: у него взрывоустойчивость 1200, а потолок здесь 60.
# Чтобы ломать обсидиан — берите C4 или Разрывную волну.
name: dynamite_a
display_name: "Динамит A"

explosion-type: DYNAMITE_A
radius-multiplier: 3.0
siege-damage: 1

fuse-seconds: 5
power: 6
cut-entity-damage: 0
works-in-water: false
works-in-lava: false

# Раскомментируйте, если конкретно этот динамит должен поджигаться сам,
# независимо от settings.dynamites.auto-ignite в config.yml.
# auto-ignite: false

# --- Что ломает взрыв --------------------------------------------------
breaking:
  # Жёсткий потолок взрывоустойчивости: блоки с сопротивлением выше
  # не трогаем вообще (обсидиан = 1200, древние обломки = 1200,
  # булыжник = 6, глубокий сланец = 6).
  max-resistance: 60
  # Множитель из ванильной формулы: эффективное сопротивление =
  # (resistance + 0.3) * resistance-scale. Меньше значение — легче ломать.
  resistance-scale: 0.3
  # Шанс, что сломанный блок выпадет предметом (для блоков без явного правила).
  default-drop-chance: 100
  # Явные правила по материалам. Они перекрывают и потолок, и формулу —
  # единственный способ дать динамиту пробить обсидиан.
  blocks: { }
  #  blocks:
  #    OBSIDIAN:
  #      break-chance: 100     # шанс сломать, %
  #      drop-chance: 0        # шанс, что блок выпадет предметом, %

raid-block:
  enabled: false
  duration-seconds: 300

item:
  material: TNT
  display_name: "&6Динамит A"
  lore:
    - ""
    - "&8 • &fРадиус урона осаде в &e3 раза&f больше обычного."
    - "&8 • &fФитиль: &e5 &fсекунд."
    - "&8 • &fОбсидиан не берёт: нужен C4 или Разрывная волна."
  glow: true

recipe:
  shape:
    - "GSG"
    - "GTG"
    - "GSG"
  ingredients:
    G: GUNPOWDER
    S: SAND
    T: TNT
