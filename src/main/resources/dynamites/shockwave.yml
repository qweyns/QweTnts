# Разрывная волна — ломает обсидиан, работает в воде и лаве (уничтожая их),
# превращает древние обломки в обычный обсидиан, сносит 2 прочности привата
# за раз и оставляет рейд-блок на 5 минут.
#
# Важно: древние обломки НЕ ломаются, а деградируют — первый взрыв делает из
# них обсидиан, и только следующий его выбивает. Ядра приватов (isCore)
# трансформация не затрагивает никогда.
name: shockwave
display_name: "Разрывная волна"

explosion-type: SHOCKWAVE
radius-multiplier: 1.0
siege-damage: 2

fuse-seconds: 4
power: 4
cut-entity-damage: 0
works-in-water: true
works-in-lava: true

# auto-ignite: false

# --- Что ломает взрыв --------------------------------------------------
breaking:
  max-resistance: 1200
  resistance-scale: 0.3
  default-drop-chance: 100
  blocks:
    OBSIDIAN:
      break-chance: 100
      drop-chance: 0
    CRYING_OBSIDIAN:
      break-chance: 100
      drop-chance: 0
    ANCIENT_DEBRIS:
      break-chance: 100
      drop-chance: 100      # деградация важнее дропа: см. transformable-blocks
    WATER:
      break-chance: 100
      drop-chance: 0
    LAVA:
      break-chance: 100
      drop-chance: 0

# Деградация: материал -> во что превращается.
transformable-blocks:
  ANCIENT_DEBRIS:
    to: OBSIDIAN
  REINFORCED_DEEPSLATE:
    to: OBSIDIAN

raid-block:
  enabled: true
  duration-seconds: 300

item:
  material: TNT
  display_name: "&bРазрывная волна"
  lore:
    - ""
    - "&8 • &fРадиус как у обычного динамита."
    - "&8 • &fЛомает обсидиан, работает в воде и лаве."
    - "&8 • &fПревращает древние обломки в обычный обсидиан."
    - "&8 • &fСносит &b2 прочности&f привата за раз."
    - "&8 • &cРейд-блок 5 минут на месте взрыва."
  glow: true

recipe:
  shape:
    - "GSG"
    - "GWG"
    - "GSG"
  ingredients:
    G: GUNPOWDER
    S: SAND
    W: WATER_BUCKET
