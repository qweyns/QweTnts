# Разрывная волна — ломает обсидиан, превращает древние обломки в обсидиан,
# работает в воде/лаве (уничтожая их), сносит 2 прочности привата за раз,
# рейд-блок 5 минут.
name: shockwave
display_name: "Разрывная волна"

explosion-type: SHOCKWAVE
radius-multiplier: 1.0
siege-damage: 2

fuse-seconds: 4
power: 4
mode: vanilla
cut-entity-damage: 0
works-in-water: true
works-in-lava: true

breakable-blocks:
  OBSIDIAN:
    chance: 100
    drop-chance: 0
  CRYING_OBSIDIAN:
    chance: 100
    drop-chance: 0
  WATER:
    chance: 100
    drop-chance: 0
  LAVA:
    chance: 100
    drop-chance: 0

# Древние обломки НЕ ломаются, а деградируют в обсидиан (снесётся следующим взрывом).
# Ядра уникальных приватов (isCore) трансформация не затрагивает.
transformable-blocks:
  ANCIENT_DEBRIS:
    to: OBSIDIAN
  REINFORCED_DEEPSLATE:
    to: OBSIDIAN

raid-block:
  enabled: true
  duration-seconds: 300

item:
  material: TNT
  display_name: "&bРазрывная волна"
  lore:
    - ""
    - "&8 • &fРадиус как у обычного динамита."
    - "&8 • &fЛомает обсидиан, работает в воде и лаве."
    - "&8 • &fПревращает древние обломки в обычный обсидиан."
    - "&8 • &fСносит &b2 прочности&f привата за раз."
    - "&8 • &cРейд-блок 5 минут на месте взрыва."
  glow: true

recipe:
  shape:
    - "GSG"
    - "GWG"
    - "GSG"
  ingredients:
    G: GUNPOWDER
    S: SAND
    W: WATER_BUCKET
