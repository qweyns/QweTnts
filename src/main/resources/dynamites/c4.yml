# C4 — ломает обсидиан и плачущий обсидиан, древние обломки выбивает,
# вредит незерит-приватам и оставляет рейд-блок на 5 минут.
#
# Обсидиан пробивается НЕ силой взрыва (vanilla его вообще не трогает),
# а явным правилом в breaking.blocks — это единственный корректный способ.
name: c4
display_name: "C4"

explosion-type: C4
radius-multiplier: 1.0
siege-damage: 1

fuse-seconds: 4
power: 4
cut-entity-damage: 0
works-in-water: false
works-in-lava: false

# auto-ignite: false

# --- Что ломает взрыв --------------------------------------------------
breaking:
  # 1200 — потолок семейства обсидиана и древних обломков.
  max-resistance: 1200
  resistance-scale: 0.3
  default-drop-chance: 100
  blocks:
    OBSIDIAN:
      break-chance: 100
      drop-chance: 0        # обсидиан не выпадает — иначе рейд бесконечен
    CRYING_OBSIDIAN:
      break-chance: 100
      drop-chance: 0
    ANCIENT_DEBRIS:
      break-chance: 100
      drop-chance: 0

raid-block:
  enabled: true
  duration-seconds: 300

item:
  material: TNT
  display_name: "&7C4"
  lore:
    - ""
    - "&8 • &fРадиус как у обычной ТНТ."
    - "&8 • &fЛомает обсидиан, плачущий обсидиан и древние обломки."
    - "&8 • &cРейд-блок 5 минут на месте взрыва."
  glow: true

recipe:
  shape:
    - "GGG"
    - "GTG"
    - "GGG"
  ingredients:
    G: GUNPOWDER
    T: TNT
