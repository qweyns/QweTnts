# ============================================================
#   C4 — ломает обсидиан и древние обломки, рейд-блок 5 минут
# ============================================================
#  Полный список настроек с пояснениями — в dynamite_a.yml.
#  Здесь только то, что отличается.
# ============================================================

name: c4
display_name: "C4"
enabled: true

placement:
  placeable: true
  consume-on-use: true
  permission: ""
  permission-required: true

ignition:
  # Заряд НЕ поджигает сам себя: ставится блоком, поджигается огнивом,
  # огнём, лавой или другим взрывом. Поставьте true — вернётся старый режим.
  auto: false
  causes:
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - FIRE
    - LAVA
    - EXPLOSION
    - LIGHTNING
  delay-ticks: 0
  chain:
    enabled: true
    can-be-chained: true
    radius: 4
    delay-ticks: 2

explosion:
  type: C4
  radius-multiplier: 1.0
  power: 4
  fire: false
  fuse-seconds: 4
  fuse-spread-ticks: 0
  works-in-water: false
  works-in-lava: false
  siege-damage: 1
  max-blocks: 0

damage:
  cut-entity: 0
  cut-player: 0
  multiplier: 1.0

# Обсидиан пробивается НЕ силой взрыва (vanilla его вообще не трогает),
# а явным правилом ниже — это единственный корректный способ.
breaking:
  vanilla-blocklist: true
  max-resistance: 1200    # 1200 = потолок семейства обсидиана
  resistance-scale: 0.3
  default-drop-chance: 100
  scan-radius: 4          # радиус досмотра прочных блоков вокруг эпицентра
  blocks:
    OBSIDIAN:
      break-chance: 100
      drop-chance: 0      # обсидиан не выпадает, иначе рейд бесконечен
    CRYING_OBSIDIAN:
      break-chance: 100
      drop-chance: 0
    ANCIENT_DEBRIS:
      break-chance: 100
      drop-chance: 0

# По умолчанию C4 ломает прочные блоки сразу (см. breaking.blocks выше).
# Если хочется деградации, как у стены бункера, — раскомментируйте цепочку:
# тогда древние обломки сначала станут плачущим обсидианом, потом обсидианом,
# и только третий заряд сделает дыру.
#transforms:
#  chain:
#    - ANCIENT_DEBRIS      # первая ступень — самая прочная
#    - CRYING_OBSIDIAN     # вторая
#    - OBSIDIAN            # третья
#    - AIR                 # четвёртая — дыра
#  chain-chance: 100
transforms:

raid-block:
  enabled: true
  duration-seconds: 300
  materials:
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - ANCIENT_DEBRIS
    - ENDER_CHEST
    - ENCHANTING_TABLE
    - RESPAWN_ANCHOR
  radius: 0

# --- Добыча спавнеров (Фаза 2) ------------------------------
spawner-mining:
  enabled: true
  chance: 35     # C4 — «шахтёрский» заряд: выбивает спавнер чаще
  xp: 30
  keep-entity-type: true

# --- Временные блоки (Фаза 2) ------------------------------
#  Выключены: этот заряд лёд не оставляет. Пример — shockwave.yml.
temporary-blocks:
  enabled: false
  material: ICE
  radius: 3
  chance: 100
  duration-seconds: 30
  replace:
    - AIR
    - CAVE_AIR
    - WATER
    - LAVA

limits:
  cooldown-millis: 500    # C4 ставим чуть реже остальных (свой кулдаун)
  max-primed-per-player: 8
  max-primed-per-chunk: 16
  worlds:
    mode: INHERIT
    allowed-worlds: []
    blocked-worlds: []

effects:
  on-ignite:
    sound: entity.tnt.primed
    category: BLOCKS
    volume: 1.0
    pitch: 0.9
    particle: SMOKE
    particle-count: 4
    spread: 0.2
  on-explode:
    sound: entity.generic.explode
    category: BLOCKS
    volume: 1.2
    pitch: 0.8
    particle: EXPLOSION_EMITTER
    particle-count: 1
    spread: 0.0

item:
  material: TNT
  display_name: "<gradient:#FB7185:#FCA5A5>C4 Взрывчатка</gradient>"
  lore:
    - ""
    - "<#A79FC0> ▪ <#F2EFFA>Радиус как у обычного динамита."
    - "<#A79FC0> ▪ <#F2EFFA>Ломает обсидиан, плачущий обсидиан и древние обломки."
    - "<#A79FC0> ▪ <#FB7185>Рейд-блок на 5 минут на месте взрыва."
    - ""
    - "<#A79FC0><italic>Крафт: 5 пороха, 2 песка и 2 «Динамит B»."
  glow: true
  custom-model-data: 0
  item-model: ""
  unbreakable: false

messages:
  placed: ""
  ignited: ""

craftable: true
recipe:
  # Рецепт HolyWorld Lite: 5 пороха, 2 песка и 2 «Динамит B».
  # Ванильный TNT здесь больше не подходит: C4 — вершина линейки A → B → C4,
  # и собирается из предыдущей ступени, а не из тротила.
  shape:
    - "GSG"
    - "BGB"
    - "GSG"
  ingredients:
    G: GUNPOWDER
    S: SAND
    B:
      custom-type: dynamite_b   # требуется именно Динамит B по PDC-метке
