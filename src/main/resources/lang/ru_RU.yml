# ============================================================
#   QweTnts — русский язык (ru_RU)
# ============================================================
#  Оформление — как в QweProtectStones:
#    • MiniMessage-теги: <#RRGGBB>, <bold>, <gradient:#A:#B>...</gradient>
#    • legacy-коды тоже понимаются: &c, &l, &#RRGGBB
#  Палитра QweTnts (та же семья, что и QweProtectStones):
#    #FF6B35 → #FFB347   градиент префикса — «огонь», отличие от QPS
#    #FB7185             ошибка, запрет, угроза
#    #86EFAC             успех
#    #FDE68A             значение: число, ник, название
#    #F2EFFA             основной текст
#    #A79FC0             пояснение и маркер « ▪ »
#    • плейсхолдеры в стиле %name%, %prefix% подставляется автоматически
#    • любой ключ можно сделать списком — каждая строка '-' уйдёт отдельной
#      строкой чата
#  НЕ НАДО удалять ключи: недостающие ключи плагин доберёт из jar и
#  напишет предупреждение в консоль.
# ============================================================

prefix: "<bold><gradient:#FF6B35:#FFB347>QweTnts</gradient></bold> <#A79FC0>» "

# --- Общее ---
no_permission: "%prefix%<#FB7185>У вас нет прав на этот динамит."
unknown_subcommand: "%prefix%<#FB7185>Неизвестная подкоманда. Напишите <#FDE68A>/%command% help"
unknown_owner: "Неизвестно"

# --- Установка и поджог ---
dynamite_placed: "%prefix%<#86EFAC>%name% <#86EFAC>установлен."
ignition_hint: "%prefix%<#A79FC0>Подожгите его огнивом, огнём или другим взрывом."
dynamite_ignited: "%prefix%<#FDE68A>%name% <#A79FC0>горит!"
cannon_fired: "%prefix%<#A79FC0>Пушка выстрелила: <#FDE68A>%name% <#A79FC0>· осталось <#FDE68A>%count%"
cannon_placed: "%prefix%<#A79FC0>Пушка установлена: откройте её ПКМ и положите динамит в центральный слот."
cannon_loaded: "%prefix%<#A79FC0>Заряжено: <#FDE68A>%name% <#A79FC0>× <#FDE68A>%count%"
cannon_ammo_denied: "%prefix%<#FB7185>Этот динамит нельзя заряжать в пушку."
cannon_ammo_tnt: "Тротил (ванильный TNT)"
dynamite_removed: "%prefix%<#A79FC0>%name% <#A79FC0>снят и вернулся в инвентарь."
cannot_place_here: "%prefix%<#FB7185>Сюда динамит поставить нельзя."
region_denied: "%prefix%<#FB7185>Здесь чужой приват — ставить динамит нельзя."
dynamite_only_outside: "%prefix%<#FB7185><#FDE68A>%name%<#FB7185> не работает на заприваченной территории."

# --- Запреты ---
world_disabled: "%prefix%<#FB7185>Динамиты отключены в мире <#FDE68A>%world%<#FB7185>."
spawn_protected: "%prefix%<#FB7185>Здесь нельзя использовать динамиты (защита спавна, радиус <#FDE68A>%radius%<#FB7185>)."
raid_block_denied: "%prefix%<#FB7185>Здесь нельзя ставить обсидиан ещё <#FDE68A>%time%<#FB7185> (рейд-блок)."

# --- Анти-лаг ---
cooldown: "%prefix%<#FB7185>Слишком часто! Подождите <#FDE68A>%seconds%<#FB7185>."
player_limit: "%prefix%<#FB7185>У вас уже слишком много горящего динамита — дождитесь взрывов."
chunk_limit: "%prefix%<#FB7185>В этом чанке слишком много горящего динамита."

# --- Время (используется в подстановках) ---
time_seconds: "<#FDE68A>%seconds% <#A79FC0>сек"
time_minutes_seconds: "<#FDE68A>%minutes% <#A79FC0>мин <#FDE68A>%seconds% <#A79FC0>сек"

# --- Команды ---
command_reload: "%prefix%<#86EFAC>Конфигурация перезагружена. Загружено динамитов: <#FDE68A>%count%<#86EFAC>."
command_info_header: "%prefix%<#FDE68A>%name%"
command_info_line: "  <#A79FC0>▪ <#F2EFFA>%key%<#A79FC0>: <#FDE68A>%value%"
command_stats_header: "%prefix%<#A79FC0>Статистика QweTnts с запуска сервера:"
stats_dynamites_loaded: "Динамитов загружено"
stats_explosions_total: "Взрывов всего"
stats_explosions_by_type: "Взрывов типа %type%"
stats_raid_blocks_active: "Рейд-блоков активно"
stats_raid_blocks_marked: "Рейд-блоков отмечено"
stats_spawners_mined: "Спавнеров выбито"
stats_temporary_blocks: "Временных блоков поставлено"
stats_regions_destroyed: "Приватов уничтожено"
stats_qps_version: "QweProtectStones"
stats_qps_missing: "QweProtectStones не найден"
cleared_raid_blocks: "Очищено рейд-блоков"
cleared_temporary_blocks: "Очищено временных блоков"
cleared_placed: "Очищено установленных динамитов"
bunker_degraded: "%prefix%<#FDE68A>Стена бункера дала трещину: стадия <#A78BFA>%stage%<#FDE68A> из <#A78BFA>%of%<#FDE68A> (<#A78BFA>%material%<#FDE68A>)."
bunker_breached: "%prefix%<#FDE68A>Стена бункера пробита игроком <#A78BFA>%player%<#FDE68A>! Проход открыт."
bunker_restored: "%prefix%<#A79FC0>Стена бункера восстановлена: <#FDE68A>%material%<#A79FC0>."
discord_bunker_breached: "🏰 Стена бункера пробита (%player%, стадия %stage% из %of%)."
command_bunker_status: "%prefix%<#A79FC0>Бункер: стадия <#FDE68A>%stage%<#A79FC0> из <#FDE68A>%of%<#A79FC0>, материал <#FDE68A>%material%<#A79FC0>, состояние: <#FDE68A>%state%<#A79FC0>, до восстановления: <#FDE68A>%respawn%<#A79FC0>."
command_bunker_disabled: "%prefix%<#FB7185>Бункер отключён в bunker.yml."
command_bunker_reset: "%prefix%<#A79FC0>Стена бункера возвращена в исходное состояние."
command_bunker_stage: "%prefix%<#A79FC0>Стадия стены бункера: <#FDE68A>%stage%<#A79FC0> из <#FDE68A>%of%<#A79FC0> (<#FDE68A>%material%<#A79FC0>)."
command_list_header: "%prefix%<#A79FC0>Доступные динамиты (<#FDE68A>%count%<#A79FC0>):"
command_list_empty: "%prefix%<#FB7185>Ни одного динамита не загружено — проверьте папку dynamites/ и файл cannon.yml."
command_list_item: "  <#A79FC0>▪ <#F2EFFA>%name% <#A79FC0>(<#A78BFA>%id%<#A79FC0>) тип <#A78BFA>%explosion%<#A79FC0>, мощность <#FDE68A>%power%<#A79FC0>, урон осаде <#FDE68A>%siege%<#A79FC0>, поджог: <#FDE68A>%ignite%"
command_list_footer: "%prefix%<#A79FC0>Выдать: <#FDE68A>/qtnt give <id> [игрок] [кол-во]"
usage_give: "%prefix%<#FB7185>Использование: <#FDE68A>/%command% give <id> [игрок] [кол-во]"
dynamite_not_found: "%prefix%<#FB7185>Динамит <#FDE68A>%id% <#FB7185>не найден."
player_not_found: "%prefix%<#FB7185>Игрок <#FDE68A>%player% <#FB7185>не в сети."
specify_player: "%prefix%<#FB7185>Из консоли нужно указать игрока."
invalid_amount: "%prefix%<#FB7185>Количество должно быть числом от 1 до 320 (<#FDE68A>%amount%<#FB7185>)."
give_success: "%prefix%<#86EFAC>Выдано <#FDE68A>%amount% × %name% <#86EFAC>игроку <#FDE68A>%player%<#86EFAC>."
give_success_partial: "%prefix%<#FDE68A>Часть не влезла в инвентарь: <#FDE68A>%amount% × %name% <#A79FC0>выдано, остальное брошено под ноги <#FDE68A>%player%<#A79FC0>."

command_help:
  - "%prefix%<#A79FC0>Команды QweTnts:"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt list<#A79FC0> — список динамитов"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt give <id> [игрок] [кол-во]<#A79FC0> — выдать динамит"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt reload<#A79FC0> — перезагрузить config.yml, dynamites/, cannon.yml и bunker.yml"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt info [id]<#A79FC0> — параметры динамита (без id — все сразу)"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt stats<#A79FC0> — счётчики: взрывы, спавнеры, рейд-блоки"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt clear <raid-blocks|temporary-blocks|placed|all><#A79FC0> — очистить"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt bunker <status|reset|stage \u003cn\u003e><#A79FC0> — стена бункера замка"

# --- Подстановки ---
value_auto: "сам"
value_manual: "вручную"
value_breached: "пробита"
value_intact: "цела"

