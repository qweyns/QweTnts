# ============================================================
#   QweTnts — English (en_US) — fallback language
# ============================================================
#  Styling matches QweProtectStones:
#    • MiniMessage tags: <#RRGGBB>, <bold>, <gradient:#A:#B>...</gradient>
#    • legacy codes still work: &c, &l, &#RRGGBB
#  QweTnts palette (same family as QweProtectStones):
#    #FF6B35 → #FFB347   prefix gradient — "fire", differs from QPS
#    #FB7185             error, denial, threat
#    #86EFAC             success
#    #FDE68A             value: number, player name, item name
#    #F2EFFA             main text
#    #A79FC0             hint and the " ▪ " marker
#    • placeholders are written as %name%; %prefix% is replaced automatically
#    • any key may become a list — every '-' line is a separate chat line
# ============================================================

prefix: "<bold><gradient:#FF6B35:#FFB347>QweTnts</gradient></bold> <#A79FC0>» "

# --- Common ---
no_permission: "%prefix%<#FB7185>You don't have permission to use this dynamite."
unknown_subcommand: "%prefix%<#FB7185>Unknown subcommand. Try <#FDE68A>/%command% help"
unknown_owner: "Unknown"

# --- Placing and ignition ---
dynamite_placed: "%prefix%<#86EFAC>%name% <#86EFAC>has been placed."
ignition_hint: "%prefix%<#A79FC0>Light it with flint and steel, fire or another explosion."
dynamite_ignited: "%prefix%<#FDE68A>%name% <#A79FC0>is burning!"
cannon_fired: "%prefix%<#A79FC0>Cannon fired: <#FDE68A>%name% <#A79FC0>· <#FDE68A>%count% <#A79FC0>left"
cannon_placed: "%prefix%<#A79FC0>Cannon placed: right-click it and put a dynamite in the middle slot."
cannon_loaded: "%prefix%<#A79FC0>Loaded: <#FDE68A>%name% <#A79FC0>× <#FDE68A>%count%"
cannon_ammo_denied: "%prefix%<#FB7185>This dynamite cannot be loaded into the cannon."
cannon_ammo_tnt: "Plain TNT"
dynamite_removed: "%prefix%<#A79FC0>%name% <#A79FC0>picked back up."
cannot_place_here: "%prefix%<#FB7185>You can't place a dynamite here."
region_denied: "%prefix%<#FB7185>This is someone else's region."
dynamite_only_outside: "%prefix%<#FB7185><#FDE68A>%name%<#FB7185> does not work inside claimed regions."

# --- Denials ---
world_disabled: "%prefix%<#FB7185>Dynamites are disabled in world <#FDE68A>%world%<#FB7185>."
spawn_protected: "%prefix%<#FB7185>Dynamites are disabled near spawn (<#FDE68A>%radius% <#FB7185>blocks)."
raid_block_denied: "%prefix%<#FB7185>Obsidian can't be placed here for another <#FDE68A>%time% <#FB7185>(raid block)."

# --- Anti-lag ---
cooldown: "%prefix%<#FB7185>Too fast! Wait <#FDE68A>%seconds%<#FB7185>."
player_limit: "%prefix%<#FB7185>You already have too many burning charges."
chunk_limit: "%prefix%<#FB7185>Too many burning charges in this chunk."

# --- Time ---
time_seconds: "<#FDE68A>%seconds% <#A79FC0>s"
time_minutes_seconds: "<#FDE68A>%minutes% <#A79FC0>m <#FDE68A>%seconds% <#A79FC0>s"

# --- Commands ---
command_reload: "%prefix%<#86EFAC>Configuration reloaded. Dynamites loaded: <#FDE68A>%count%<#86EFAC>."
command_info_header: "%prefix%<#FDE68A>%name%"
command_info_line: "  <#A79FC0>▪ <#F2EFFA>%key%<#A79FC0>: <#FDE68A>%value%"
command_stats_header: "%prefix%<#A79FC0>QweTnts stats since server start:"
stats_dynamites_loaded: "Dynamites loaded"
stats_explosions_total: "Explosions total"
stats_explosions_by_type: "Explosions of type %type%"
stats_raid_blocks_active: "Raid blocks active"
stats_raid_blocks_marked: "Raid blocks marked"
stats_spawners_mined: "Spawners mined"
stats_temporary_blocks: "Temporary blocks placed"
stats_regions_destroyed: "Regions destroyed"
stats_qps_version: "QweProtectStones"
stats_qps_missing: "QweProtectStones not found"
cleared_raid_blocks: "Raid blocks cleared"
cleared_temporary_blocks: "Temporary blocks cleared"
cleared_placed: "Placed dynamites cleared"
bunker_degraded: "%prefix%<#FDE68A>The bunker wall cracks: stage <#A78BFA>%stage%<#FDE68A> of <#A78BFA>%of%<#FDE68A> (<#A78BFA>%material%<#FDE68A>)."
bunker_breached: "%prefix%<#FDE68A>The bunker wall is breached by <#A78BFA>%player%<#FDE68A>! The way is open."
bunker_restored: "%prefix%<#A79FC0>The bunker wall is restored: <#FDE68A>%material%<#A79FC0>."
discord_bunker_breached: "🏰 The bunker wall has been breached (%player%, stage %stage% of %of%)."
command_bunker_status: "%prefix%<#A79FC0>Bunker: stage <#FDE68A>%stage%<#A79FC0> of <#FDE68A>%of%<#A79FC0>, material <#FDE68A>%material%<#A79FC0>, state: <#FDE68A>%state%<#A79FC0>, respawn in: <#FDE68A>%respawn%<#A79FC0>."
command_bunker_disabled: "%prefix%<#FB7185>The bunker is disabled in bunker.yml."
command_bunker_reset: "%prefix%<#A79FC0>The bunker wall has been restored to its initial state."
command_bunker_stage: "%prefix%<#A79FC0>Bunker wall stage: <#FDE68A>%stage%<#A79FC0> of <#FDE68A>%of%<#A79FC0> (<#FDE68A>%material%<#A79FC0>)."
command_list_header: "%prefix%<#A79FC0>Available dynamites (<#FDE68A>%count%<#A79FC0>):"
command_list_empty: "%prefix%<#FB7185>No dynamites loaded — check the dynamites/ folder and cannon.yml."
command_list_item: "  <#A79FC0>▪ <#F2EFFA>%name% <#A79FC0>(<#A78BFA>%id%<#A79FC0>) type <#A78BFA>%explosion%<#A79FC0>, power <#FDE68A>%power%<#A79FC0>, siege damage <#FDE68A>%siege%<#A79FC0>, ignition: <#FDE68A>%ignite%"
command_list_footer: "%prefix%<#A79FC0>Give: <#FDE68A>/qtnt give <id> [player] [amount]"
usage_give: "%prefix%<#FB7185>Usage: <#FDE68A>/%command% give <id> [player] [amount]"
dynamite_not_found: "%prefix%<#FB7185>Dynamite <#FDE68A>%id% <#FB7185>not found."
player_not_found: "%prefix%<#FB7185>Player <#FDE68A>%player% <#FB7185>is not online."
specify_player: "%prefix%<#FB7185>Specify a player when running from console."
invalid_amount: "%prefix%<#FB7185>Amount must be between 1 and 320 (<#FDE68A>%amount%<#FB7185>)."
give_success: "%prefix%<#86EFAC>Gave <#FDE68A>%amount% × %name% <#86EFAC>to <#FDE68A>%player%<#86EFAC>."
give_success_partial: "%prefix%<#FDE68A>%amount% × %name% <#A79FC0>given to <#FDE68A>%player%<#A79FC0>, the rest was dropped on the ground."

command_help:
  - "%prefix%<#A79FC0>QweTnts commands:"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt list<#A79FC0> — list dynamites"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt give <id> [player] [amount]<#A79FC0> — give a dynamite"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt reload<#A79FC0> — reload config.yml, dynamites/, cannon.yml and bunker.yml"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt info [id]<#A79FC0> — show dynamite settings (no id — all of them)"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt stats<#A79FC0> — counters: explosions, spawners, raid blocks"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt clear <raid-blocks|temporary-blocks|placed|all><#A79FC0> — clear"
  - "  <#A79FC0>▪ <#FDE68A>/qtnt bunker <status|reset|stage \u003cn\u003e><#A79FC0> — castle bunker wall"

# --- Values ---
value_auto: "auto"
value_manual: "manual"
value_breached: "breached"
value_intact: "intact"

# --- Logs ---
log_region_destroyed: "[RAID] Region %id% (type %type%) of %owner% destroyed. Last attacker: %attacker%"
alert_region_attacked: "%prefix%<#FB7185>Your region <#FDE68A>%id%<#FB7185> is under attack: <#FDE68A>%type%<#FB7185> by <#FDE68A>%attacker%<#FB7185>."
discord_region_under_attack: "⚔ Region **%id%** is under attack: %type% (by %attacker%)."

# --- Discord (plain text, no chat markup here) ---
discord_region_destroyed: "Region %id% (type %type%) owned by %owner% destroyed by raid. Attacker: %attacker%"
