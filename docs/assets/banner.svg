<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">QweTnts</title>
  <desc id="desc">Кастомные динамиты для QweProtectStones. Осады, рейд-блоки и механика HolyWorld Lite. Парящий блок TNT в силовом поле с горящим фитилём на тёмном фоне, анимированная сцена.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="0.55" stop-color="#161233"/>
      <stop offset="1" stop-color="#2a1a35"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffdcb8"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b48a"/>
      <stop offset="1" stop-color="#c96b34"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0562a"/>
      <stop offset="1" stop-color="#7c2f18"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8401e"/>
      <stop offset="1" stop-color="#5c2412"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#FF6B35" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#c4b5fd" fill-opacity="0.14"/>
    </pattern>
    <mask id="dotsMask">
      <linearGradient id="dotsFade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000"/>
        <stop offset="0.45" stop-color="#000"/>
        <stop offset="0.75" stop-color="#fff"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <rect width="1200" height="340" fill="url(#dotsFade)"/>
    </mask>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#dots)" mask="url(#dotsMask)"/>
  <circle cx="955" cy="172" r="230" fill="url(#halo)"/>
  <circle cx="1030" cy="120" r="140" fill="url(#haloViolet)"/>

  <g>
    <rect x="56" y="60" width="30" height="6" rx="3" fill="url(#accentLine)"/>
    <rect x="92" y="60" width="10" height="6" rx="3" fill="url(#accentLine)" opacity="0.5"/>

    <text x="56" y="128" fill="url(#titleFade)" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">QweTnts</text>

    <text x="57" y="172" fill="#ffcfa3" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500">Кастомные динамиты для QweProtectStones</text>
    <text x="57" y="205" fill="#9c92b6" font-family="'Segoe UI', Arial, sans-serif" font-size="18">Осады, рейд-блоки, спавнер-майнинг и ТНТ-пушка</text>

    <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#f7e6d6">
      <rect x="57" y="246" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#FFB347" stroke-opacity="0.25"/>
      <circle cx="76" cy="263" r="4" fill="#FF6B35"/>
      <text x="88" y="268">Paper 1.21.4</text>

      <rect x="197" y="246" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#FFB347" stroke-opacity="0.25"/>
      <circle cx="216" cy="263" r="4" fill="#FFB347"/>
      <text x="228" y="268">Java 21</text>

      <rect x="305" y="246" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#FFB347" stroke-opacity="0.25"/>
      <circle cx="324" cy="263" r="4" fill="#a78bfa"/>
      <text x="336" y="268">Аддон QPS</text>
    </g>
  </g>

  <g>
    <ellipse cx="965" cy="292" rx="120" ry="16" fill="#000000" opacity="0.28" filter="url(#softBlur)"/>

    <!-- силовое поле-контейнер, как в баннере QweProtectStones -->
    <g fill="none" stroke-linecap="round">
      <ellipse cx="965" cy="176" rx="158" ry="58" stroke="url(#accentLine)" stroke-opacity="0.35" stroke-width="1.6"/>
      <ellipse cx="965" cy="176" rx="158" ry="58" stroke="#FFB347" stroke-opacity="0.26" stroke-width="1.4" transform="rotate(60 965 176)"/>
      <ellipse cx="965" cy="176" rx="158" ry="58" stroke="#a78bfa" stroke-opacity="0.26" stroke-width="1.4" transform="rotate(120 965 176)">
        <animateTransform attributeName="transform" type="rotate" from="120 965 176" to="480 965 176" dur="26s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <circle cx="965" cy="118" r="3" fill="#FFB347"/>
    <circle cx="965" cy="118" r="7" fill="#FFB347" opacity="0.4" filter="url(#glowSmall)"/>
    <circle cx="1108" cy="176" r="2.6" fill="#a78bfa"/>
    <circle cx="1108" cy="176" r="6" fill="#a78bfa" opacity="0.35" filter="url(#glowSmall)"/>
    <circle cx="822" cy="176" r="2.6" fill="#FF6B35"/>
    <circle cx="822" cy="176" r="6" fill="#FF6B35" opacity="0.35" filter="url(#glowSmall)"/>

    <!-- осколки ящика, удерживаемые полем -->
    <path d="M1076 209 1089 202 1102 209 1089 217Z" fill="url(#faceRight)" opacity="0.9"/>
    <path d="M846 149 857 143 868 149 857 156Z" fill="url(#faceLeft)" opacity="0.9"/>

    <!-- парящий блок TNT с фитилём -->
    <g id="floatBlock">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-9; 0,0" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/>

      <path d="M965 100 C 962 78 978 70 976 54" fill="none" stroke="#6b5a4a" stroke-width="4" stroke-linecap="round"/>

      <circle r="3.4" fill="#FFF3C4">
        <animateMotion path="M976,54 C978,70 962,78 965,100" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <circle r="8" fill="#FFB347" opacity="0.4" filter="url(#glowSmall)">
        <animateMotion path="M976,54 C978,70 962,78 965,100" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="0.6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="976" cy="50" r="4" fill="#FFF3C4">
        <animate attributeName="r" values="3.4;5;3.4" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="976" cy="50" r="11" fill="#FFB347" opacity="0.45" filter="url(#glowSmall)">
        <animate attributeName="r" values="9;13;9" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.55;0.35" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="976" cy="50" r="20" fill="#FF6B35" opacity="0.18" filter="url(#glowSmall)">
        <animate attributeName="opacity" values="0.12;0.24;0.12" dur="0.8s" repeatCount="indefinite"/>
      </circle>

      <path d="M895 138 965 100 1035 138 965 176Z" fill="url(#faceTop)"/>
      <path d="M895 138 965 176 965 248 895 210Z" fill="url(#faceLeft)"/>
      <path d="M965 176 1035 138 1035 210 965 248Z" fill="url(#faceRight)"/>

      <path d="M916 138 965 111 1014 138 965 165Z" fill="#5a3b2c" fill-opacity="0.55"/>
      <circle cx="965" cy="138" r="9" fill="#3b2a22" fill-opacity="0.7"/>

      <path d="M895 166.8 965 204.8 965 220.6 895 182.6Z" fill="#f4f1ea"/>
      <path d="M965 204.8 1035 166.8 1035 182.6 965 220.6Z" fill="#e4e0d7"/>

      <g fill="#3a2320" fill-opacity="0.85">
        <path d="M907 175.8 913 179.1 913 189.9 907 186.6Z"/>
        <path d="M918 181.8 924 185.0 924 195.8 918 192.6Z"/>
        <path d="M929 187.8 935 191.0 935 201.8 929 198.6Z"/>

        <path d="M982 198.1 988 194.8 988 205.6 982 208.9Z"/>
        <path d="M993 192.1 999 188.8 999 198.8 993 202.1Z"/>
        <path d="M1004 186.1 1010 182.9 1010 193.9 1004 197.1Z"/>
      </g>
    </g>
  </g>

  <rect width="1200" height="340" rx="28" fill="url(#vignette)"/>
</svg>
